[project]
name = "ops-copilot"
version = "0.1.0"
description = "Ops Copilot - 面向 Java 微服务的排障 Agent（Agent 运行时 + 工具协议 + 评测平台）"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
