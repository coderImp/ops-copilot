[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-copilot"
version = "0.1.0"
description = "Ops Copilot - 面向 Java 微服务的排障 Agent（Agent 运行时 + 工具协议 + 评测平台）"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
include = ["agent*", "sim*", "eval*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
